# Wi-Fi access point. Change ssid / passphrase before real use.
interface=wlan0
driver=nl80211
ssid=depot
hw_mode=g
channel=6
wmm_enabled=0
macaddr_acl=0
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP
wpa_passphrase=depot321
# Set to your country code (IN, US, GB, ...)
country_code=IN
