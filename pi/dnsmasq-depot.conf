# DHCP + DNS for the hub. Any website name resolves to the Pi, so phones
# show the "sign in to network" page that opens DEPOT automatically.
interface=wlan0
bind-interfaces
dhcp-range=10.42.0.50,10.42.0.100,255.255.255.0,12h
dhcp-option=3,10.42.0.1
dhcp-option=6,10.42.0.1
address=/#/10.42.0.1
dhcp-leasefile=/var/lib/misc/dnsmasq.leases
