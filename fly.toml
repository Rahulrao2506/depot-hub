# Optional: Fly.io alternative. Run `fly launch --no-deploy --copy-config`, then
# `fly volumes create depot_data --size 1`, `fly secrets set DEPOT_PIN=1234`, `fly deploy`.
app = "depot-hub"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  DEPOT_MAX_STORAGE_MB = "800"

[mounts]
  source = "depot_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"
